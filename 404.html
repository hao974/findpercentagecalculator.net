<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found</title>
<meta name="robots" content="noindex, nofollow">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; background:#f8f9fa; min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; }
  .box { max-width:500px; }
  .code { font-size:100px; font-weight:800; color:#e74c3c; line-height:1; }
  .msg { font-size:22px; font-weight:600; margin:12px 0 8px; color:#333; }
  .sub { font-size:15px; color:#777; margin-bottom:24px; }
  a.btn { display:inline-block; background:#e74c3c; color:#fff; padding:12px 28px; border-radius:6px; text-decoration:none; font-size:15px; font-weight:600; }
  a.btn:hover { background:#c0392b; }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <div class="msg">Page Not Found</div>
    <div class="sub">The page you are looking for does not exist or has been moved.</div>
    <a class="btn" href="/">Go to Homepage</a>
  </div>
</body>
</html>
